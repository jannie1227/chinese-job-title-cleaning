[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chinese-job-title-cleaning"
version = "0.1.0"
description = "Public Chinese recruitment cleaning with documented local-only inputs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []
license = "MIT"
authors = [{name = "jannie1227"}]

[project.urls]
Repository = "https://github.com/jannie1227/chinese-job-title-cleaning"

[project.scripts]
job-title-clean = "chinese_job_title_cleaning.cli:main"
job-title-revise = "chinese_job_title_cleaning._frozen_revision:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
chinese_job_title_cleaning = ["data_rules/*.csv", "data_rules/*.json"]
